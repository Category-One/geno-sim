name: baseline
seed: 20260813
notes: >
  Calm environment. Steady fiat expansion, no shocks, no redemption
  pressure. This is the control run: if anything misbehaves here, it is a
  bug in the mechanism, not a stress result.

reserve:
  initial_reserve_value: 1000000.0
  initial_claims: 1000000.0
  redemption_ratio: 1.0
  external_capital: 0.0          # 1x backing. Raise this to model true 2x.
  basket_weights: {tips: 0.4, gold: 0.3, equities: 0.2, cash: 0.1}
  basket_vol:     {tips: 0.05, gold: 0.15, equities: 0.18, cash: 0.005}
  basket_drift:   {tips: 0.02, gold: 0.03, equities: 0.06, cash: 0.01}

mechanism:
  fee_rate: 0.001
  fee_split_to_reserve: 0.5
  fee_split_to_geno: 0.5
  theta_min: 0.5
  theta_max: 4.0
  geno_burn_rate: 0.02
  velocity_window: 30
  mirror_sensitivity: 1.0

scenario:
  n_steps: 720
  steps_per_year: 360
  fiat_expansion_rate: 0.05
  oracle_lag: 1
  oracle_noise: 0.0
