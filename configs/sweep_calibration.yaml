name: sweep_calibration
seed: 1
notes: >
  Direct test of the parameter-insensitivity claim. If the design is robust,
  the outcome metrics should be flat across this grid. If a cell breaks the
  floor or the velocity variance explodes at one corner, the parameters are
  load-bearing and must be published rather than withheld.
  1,620 cells. Seeds are in the grid so parameter effects can be separated
  from run-to-run noise.

reserve:
  initial_reserve_value: 1000000.0
  initial_claims: 1000000.0
  redemption_ratio: 1.0
  external_capital: 0.0
  basket_weights: {tips: 0.4, gold: 0.3, equities: 0.2, cash: 0.1}
  basket_vol:     {tips: 0.05, gold: 0.15, equities: 0.18, cash: 0.005}
  basket_drift:   {tips: 0.02, gold: 0.03, equities: 0.06, cash: 0.01}

mechanism:
  fee_rate: 0.001
  fee_split_to_reserve: 0.5
  fee_split_to_geno: 0.5
  theta_min: 0.5
  theta_max: 4.0
  geno_burn_rate: 0.02
  velocity_window: 30
  mirror_sensitivity: 1.0

scenario:
  n_steps: 360
  steps_per_year: 360
  fiat_expansion_rate: 0.05
  fiat_shock_step: 120
  fiat_shock_magnitude: 0.50
  oracle_lag: 3
  oracle_noise: 0.01

sweep:
  mechanism.theta_max: [2.0, 3.0, 4.0, 6.0]
  mechanism.geno_burn_rate: [0.005, 0.02, 0.05]
  mechanism.fee_split_to_reserve: [0.3, 0.5, 0.7]
  mechanism.velocity_window: [7, 30, 90]
  mechanism.mirror_sensitivity: [0.5, 1.0, 2.0]
  seed: [1, 2, 3, 4, 5]
